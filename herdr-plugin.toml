id = "christiandeckert.cheatsheet"
name = "Cheat Sheet"
version = "0.7.0"
min_herdr_version = "0.9.4"
description = "Clickable side panel with the project's just recipes plus herdr and terminal keybindings"
platforms = ["macos", "linux"]

# The panel itself; herdr runs it without a shell and closes the pane when it exits.
[[panes]]
id = "sheet"
title = "cheatsheet"
placement = "split"
command = ["zsh", "sheet.zsh"]

# Files opened from the panel's search: the editor runs in its own tab, which closes when it exits.
# The pane starts in the project directory, so the script is found through HERDR_PLUGIN_ROOT.
[[panes]]
id = "editor"
title = "editor"
placement = "tab"
command = ["zsh", "-c", "exec zsh \"$HERDR_PLUGIN_ROOT/editor.zsh\""]

[[startup]]
command = ["zsh", "panel.zsh", "ensure"]

[[events]]
on = "workspace.created"
command = ["zsh", "panel.zsh", "ensure"]

[[events]]
on = "tab.created"
command = ["zsh", "panel.zsh", "tab"]

[[actions]]
id = "toggle"
title = "Toggle cheat sheet"
contexts = ["workspace"]
command = ["zsh", "panel.zsh", "toggle"]

[[actions]]
id = "ensure"
title = "Ensure cheat sheet in tab 1"
contexts = ["workspace"]
command = ["zsh", "panel.zsh", "ensure"]

[[actions]]
id = "search"
title = "Search files"
contexts = ["workspace"]
command = ["zsh", "panel.zsh", "search"]
